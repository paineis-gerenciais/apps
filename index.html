<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Apps do dia a dia</title>
<meta name="description" content="Menu de apps do dia a dia.">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<style>
  /* ---------- Fundo: troque aqui quando a imagem chegar (ver README) ---------- */
  :root {
    --fundo: none;                    /* depois: url("assets/fundo.webp") */
    --veu: rgba(246, 243, 238, .55);  /* véu marfim por cima da imagem de fundo */
    --base: #f6f3ee;                  /* marfim */
    --texto: #24272e;                 /* grafite */
    --texto-suave: #6b6f78;
    --linha-fina: #e2ddd5;
    --ouro: #b0904f;
  }
  /* ---------- Cor de cada família ---------- */
  .vinho { --cor: #6e1420; }
  .azul  { --cor: #23346b; }
  .verde { --cor: #1f5244; }

  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    min-height: 100vh;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    color: var(--texto);
    background: var(--base);
    display: flex;
    flex-direction: column;
  }
  /* Fundo fixo em camada própria (background-attachment: fixed falha no iOS) */
  body::before {
    content: "";
    position: fixed;
    inset: 0;
    z-index: -1;
    background: linear-gradient(var(--veu), var(--veu)), var(--fundo) center / cover no-repeat, var(--base);
  }
  .voltar {
    position: absolute; top: 16px; left: 16px;
    display: inline-flex; align-items: center; min-height: 44px; padding: 8px 16px;
    font-weight: 600; font-size: 15px; text-decoration: none; color: var(--texto);
    background: #fff; border: 1px solid var(--linha-fina); border-radius: 8px;
  }
  .voltar:hover { border-color: var(--texto); }
  header { text-align: center; padding: 48px 16px 12px; }
  .simbolo { display: block; width: 84px; height: 84px; margin: 0 auto 18px; }
  .marca { display: block; width: min(330px, 78vw); height: auto; margin: 0 auto; }
  .oculto { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  .sobretitulo {
    margin: 0 0 6px; font-size: 13px; font-weight: 700; letter-spacing: .16em;
    text-transform: uppercase; color: var(--texto-suave);
  }
  h1 { margin: 0; font-size: clamp(27px, 4.6vw, 40px); font-weight: 700; letter-spacing: -.015em; text-wrap: balance; }
  .chamada { margin: 8px auto 0; max-width: 34em; font-size: 17px; color: var(--texto-suave); text-wrap: pretty; }
  main { flex: 1; padding: 26px 16px 48px; }
  .grade {
    list-style: none; margin: 0 auto; padding: 0; max-width: 1180px;
    display: flex; flex-wrap: wrap; justify-content: center; gap: 16px 20px;
  }
  .grade li { width: min(372px, 100%); display: flex; }

  /* ---------- Botão: cartão branco com um bloco de cor (como os blocos da marca) ---------- */
  .botao {
    position: relative; flex: 1;
    display: flex; align-items: center; gap: 16px;
    min-height: 92px; padding: 12px 18px 12px 12px;
    background: #fff; border: 1px solid var(--linha-fina); border-radius: 12px;
    color: var(--texto); text-decoration: none;
    box-shadow: 0 1px 2px rgba(36, 39, 46, .05);
    transition: transform .16s ease, box-shadow .16s ease, border-color .16s ease;
  }
  a.botao:hover { transform: translateY(-2px); border-color: var(--cor); box-shadow: 0 8px 18px rgba(36, 39, 46, .12); }
  a.botao:active { transform: translateY(0); }
  .botao:focus-visible, .voltar:focus-visible { outline: 3px solid var(--ouro); outline-offset: 3px; }
  .icone {
    flex: none; display: grid; place-items: center;
    width: 68px; height: 68px; border-radius: 8px;
    background: var(--cor); color: #fff;
  }
  .icone svg { width: 38px; height: 38px; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
  .icone .cheio { fill: currentColor; stroke: none; }
  .rotulo { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
  .linha { font-size: 13.5px; font-weight: 600; letter-spacing: .01em; color: var(--cor); }
  .nome { font-size: 21px; font-weight: 700; letter-spacing: -.01em; line-height: 1.15; text-wrap: balance; }
  /* ---------- Em breve: sem clique, apagado, com selo ---------- */
  .breve { background: rgba(255, 255, 255, .55); border-style: dashed; box-shadow: none; cursor: default; }
  .breve .icone { background: #b3aea6; }
  .breve .linha, .breve .nome { color: var(--texto-suave); }
  .selo {
    position: absolute; top: 9px; right: 10px;
    padding: 2px 8px; border: 1px solid #cdc7be; border-radius: 999px; background: #fff;
    font-size: 10.5px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--texto-suave);
  }
  footer { text-align: center; font-size: 13px; padding: 0 16px 20px; color: var(--texto-suave); }

  @media (max-width: 560px) {
    header { padding-top: 80px; }
    .simbolo { width: 68px; height: 68px; margin-bottom: 14px; }
    .grade { gap: 10px; }
    .botao { min-height: 84px; }
    .icone { width: 60px; height: 60px; }
    .icone svg { width: 34px; height: 34px; }
    .nome { font-size: 19.5px; }
    .botao.porta { flex-direction: row; }
    .porta .topo { width: 104px; height: auto; flex: none; }
    .porta .topo svg { width: 56px; height: 56px; }
    .porta .rotulo { padding: 14px 16px; }
    .porta .nome { font-size: 20px; }
    .porta .linha { font-size: 14.5px; }
    .porta .abrir { display: none; }
  }
  @media (prefers-reduced-motion: reduce) { .botao { transition: none; } }
</style>
</head>
<body>
